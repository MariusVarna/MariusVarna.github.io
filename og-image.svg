<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <style type="text/css">
      @font-face {
        font-family: 'Sora';
        font-weight: 100 800;
        src: url('{{FONT:Sora-Variable.ttf}}') format('truetype');
      }
      @font-face {
        font-family: 'Space Mono';
        font-weight: 700;
        src: url('{{FONT:SpaceMono-Bold.ttf}}') format('truetype');
      }
      @font-face {
        font-family: 'Space Mono';
        font-weight: 400;
        src: url('{{FONT:SpaceMono-Regular.ttf}}') format('truetype');
      }
    </style>
    <linearGradient id="textGradient" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#c0c1ff"/>
      <stop offset="100%" stop-color="#5de6ff"/>
    </linearGradient>
    <radialGradient id="ambientGlow" cx="0.5" cy="0.5" r="0.6">
      <stop offset="0%" stop-color="#8083ff" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#0b1326" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="50" height="50" patternUnits="userSpaceOnUse">
      <path d="M 50 0 L 0 0 0 50" fill="none" stroke="#ffffff" stroke-opacity="0.05" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="630" fill="#0b1326"/>
  <rect width="1200" height="630" fill="url(#grid)"/>
  <rect width="1200" height="630" fill="url(#ambientGlow)"/>

  <line x1="0" y1="0" x2="240" y2="0" stroke="#5de6ff" stroke-width="3"/>
  <line x1="0" y1="0" x2="0" y2="240" stroke="#5de6ff" stroke-width="3"/>

  <text x="80" y="125" font-family="Sora, sans-serif" font-weight="800" font-size="72" fill="#dae2fd">Marius Varna</text>
  <text x="80" y="172" font-family="'Space Mono', monospace" font-weight="700" font-size="22" fill="#5de6ff" letter-spacing="3">SOFTWARE SYSTEMS  ·  KTU</text>

  <text x="80" y="370" font-family="Sora, sans-serif" font-weight="800" font-size="104" fill="#dae2fd">Code.</text>
  <text x="80" y="495" font-family="Sora, sans-serif" font-weight="800" font-size="104">
    <tspan fill="url(#textGradient)">Diagnose.</tspan><tspan fill="#dae2fd" dx="22">Repeat.</tspan>
  </text>

  <text x="80" y="595" font-family="'Space Mono', monospace" font-weight="400" font-size="20" fill="#c7c4d7">github.com/MariusVarna  ·  linkedin.com/in/marius-varna</text>
</svg>
